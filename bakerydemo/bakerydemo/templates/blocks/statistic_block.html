<div class="statistic-block-wrapper" style="padding: 40px 0; display: flex; justify-content: center;">
    <div class="statistic-card" style="text-align: center; max-width: 300px; width: 100%; padding: 25px; border-radius: 12px; background: rgba(255,255,255,0.05); box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.1);">
        <div class="statistic-number" style="font-size: 4rem; font-weight: 800; color: #ff5a5f; line-height: 1.1; margin-bottom: 10px; font-family: sans-serif;">
            {{ self.number }}
        </div>
        <div class="statistic-text" style="font-size: 1.1rem; color: #a0a0a0; font-weight: 400; line-height: 1.4;">
            {{ self.text }}
        </div>
    </div>
</div>
